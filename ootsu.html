}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

      { kind: &quot;action&quot;, label: &quot;怎么做&quot;, items: [&quot;先看电子屏确认“新快速・野洲行”和2号站台。&quot;, &quot;有行李时优先电扶梯/电梯，不为抢座横穿人流。&quot;, &quot;到大津前移到车门附近，但不要堵门。&quot;] },
      { kind: &quot;cost&quot;, label: &quot;费用&quot;, text: &quot;京都到大津已由Kansai Area Pass覆盖；新快速普通车厢没有额外特急费，也不用预约座位。&quot; },
      { kind: &quot;background&quot;, label: &quot;名词背景&quot;, text: &quot;“新快速”只是JR普通线中停站较少的快车，不是Shinkansen新干线；“野洲行”表示列车最终开往野洲。&quot; },
      { kind: &quot;risk&quot;, label: &quot;注意&quot;, text: &quot;11分钟包括下车、走站台和候车，别出错闸口。若电子屏临时改站台，以现场广播和JR工作人员指示为准。&quot; },
      { kind: &quot;backup&quot;, label: &quot;备用&quot;, text: &quot;错过11:15可乘后续开往米原/野洲方向、停靠大津的JR列车；到站后根据实际时间选择下一班酒店班车。&quot; }
    ],
    &quot;step-otsu&quot;: [
      { kind: &quot;route&quot;, label: &quot;路线&quot;, text: &quot;在JR大津站下车，先到北口改札外、自动售票机附近找活动立牌/签到点，再前往酒店免费班车乘车处。&quot; },
      { kind: &quot;action&quot;, label: &quot;数字拉力怎么做&quot;, items: [&quot;打开《再见菈菈》官方数字拉力页面并允许定位。&quot;, &quot;按现场提示扫码或使用GPS签到，看到成功画面后截屏。&quot;, &quot;总用时控制在8分钟，11:35前到班车处。&quot;] },
      { kind: &quot;cost&quot;, label: &quot;费用&quot;, text: &quot;数字拉力活动本身免费，手机流量自理；琵琶湖酒店班车对酒店客人免费、通常无需预约。&quot; },
      { kind: &quot;background&quot;, label: &quot;背景&quot;, text: &quot;数字拉力相当于手机电子集章，不是竞速活动。JR大津站只是拉力点和立牌点，不是官方动画取景地。&quot; },
      { kind: &quot;risk&quot;, label: &quot;注意&quot;, text: &quot;不要在改札通道架三脚架。班车可能满员，具体乘车处和时刻以酒店官网/站前标识为准。&quot; },
      { kind: &quot;backup&quot;, label: &quot;备用&quot;, text: &quot;错过11:35就改乘下一班班车、步行或叫出租车到酒店；若已延误，先寄存行李，数字拉力可晚间回大津站再补。&quot; }
    ],
    &quot;step-hotel&quot;: [
      { kind: &quot;route&quot;, label: &quot;路线&quot;, text: &quot;班车到琵琶湖酒店后直接去前台寄存大件行李，只带相机、16–35mm、70–200mm、三脚架、水和雨具，再步行前往大津港。&quot; },
      { kind: &quot;action&quot;, label: &quot;前台要办的事&quot;, items: [&quot;领取行李寄存牌并确认晚间取行李/入住流程。&quot;, &quot;请前台预叫12:15在大津港上车、前往JR大津京站的普通出租车。&quot;, &quot;让前台把司机接客点写清楚，并确认是否有迎车费。&quot;] },
      { kind: &quot;cost&quot;, label: &quot;费用&quot;, text: &quot;住客行李寄存通常不另收费，以酒店确认结果为准；酒店班车免费。市区普通出租车参考约¥1,000–2,000/车/单程，按计价器，迎车或预约费可能另计。&quot; },
      { kind: &quot;background&quot;, label: &quot;服务背景&quot;, text: &quot;“预叫/配车”是指定时间地点让出租车来接，不等于包车等候。不会日语时让酒店前台代叫最稳。&quot; },
      { kind: &quot;language&quot;, label: &quot;给前台看&quot;, phrase: &quot;12時15分に、大津港からJR大津京駅まで、普通タクシーを1台お願いします。三脚があります。&quot;, romaji: &quot;Juuni-ji juugo-fun ni, Otsu-kou kara JR Otsukyo-eki made, futsuu takushii o ichidai onegaishimasu. Sankyaku ga arimasu.&quot;, meaning: &quot;请安排12:15从大津港到JR大津京站的普通出租车1台；我带有三脚架。&quot;, wide: true },
      { kind: &quot;risk&quot;, label: &quot;注意&quot;, text: &quot;一定区分JR大津站与JR大津京站；目的地是后者。拿到接车公司、时间和集合点后再离开前台。&quot; }
    ],
    &quot;step-port&quot;: [
      { kind: &quot;route&quot;, label: &quot;路线&quot;, text: &quot;从酒店湖侧步行到大津港/旅客中心，先找1层候船室附近的立牌和签到点，再到港湾外侧拍摄；12:10开始收机，12:15到约定接车点。&quot; },
      { kind: &quot;action&quot;, label: &quot;巡礼怎么做&quot;, items: [&quot;先核对官方舞台图，拍一张实景与动画画面对应的记录照。&quot;, &quot;完成GPS/二维码签到并截屏。&quot;, &quot;预留最后5分钟找出租车，不把器材摊在候船通道。&quot;] },
      { kind: &quot;cost&quot;, label: &quot;费用&quot;, text: &quot;港区外观、立牌和数字拉力不需要游船票；活动本身免费。若临时登船则是另一项收费服务，本时间轴不安排。&quot; },
      { kind: &quot;background&quot;, label: &quot;背景&quot;, text: &quot;大津港是《再见菈菈》第2话官方动画舞台，同时也是第一期数字拉力点；“舞台”表示官方确认过的现实地点。&quot; },
      { kind: &quot;photo&quot;, label: &quot;摄影&quot;, text: &quot;16–35mm拍候船楼、港湾和琵琶湖的空间关系；午间光硬，以记录为主，可用偏振镜压反光但不要追求长曝光。&quot; },
      { kind: &quot;risk&quot;, label: &quot;注意&quot;, text: &quot;候船区有乘客和工作人员，避开通道与清晰人脸；12:15出租车是后续12:55湖西线的关键接驳。&quot; }
    ],
    &quot;step-taxi-otsu&quot;: [
      { kind: &quot;route&quot;, label: &quot;路线&quot;, text: &quot;12:15在大津港约定点上车，直接前往JR大津京站，目标12:35前到；不要先回JR大津站，也不要改走京阪慢速换乘。&quot; },
      { kind: &quot;action&quot;, label: &quot;上车前确认&quot;, items: [&quot;向司机出示“JR大津京駅”，并再次说明不是“JR大津駅”。&quot;, &quot;问清是否可刷卡；默认准备日元现金。&quot;, &quot;下车前取回三脚架和全部小件，向车站入口移动。&quot;] },
      { kind: &quot;cost&quot;, label: &quot;费用&quot;, text: &quot;大津港→JR大津京普通出租车参考约¥1,000–2,000/车/单程；第一交通滋贺公开费率为起步¥500/900m，之后每218m加¥100，低速每1分20秒加¥100，迎车费¥200；以计价器和当日公告为准。&quot; },
      { kind: &quot;background&quot;, label: &quot;服务背景&quot;, text: &quot;普通出租车是独享车辆、按里程/时间计费；这段不是高岛市的乘合出租。酒店代叫可以减少日语沟通和找车时间。&quot; },
      { kind: &quot;language&quot;, label: &quot;给司机看&quot;, phrase: &quot;JR大津京駅までお願いします。12時55分の湖西線に乗ります。&quot;, romaji: &quot;JR Otsukyo-eki made onegaishimasu. Juuni-ji gojuugo-fun no Kosei-sen ni norimasu.&quot;, meaning: &quot;请去JR大津京站；我要赶12:55的湖西线。&quot;, wide: true },
      { kind: &quot;backup&quot;, label: &quot;备用&quot;, text: &quot;若12:35仍未到站，车上就确认JR实时运行；到站后直接进闸。确定赶不上12:55时，立刻按延误规则联系神社往返车并压缩拍摄。&quot; }
    ],
    &quot;step-kosei-out&quot;: [
      { kind: &quot;route&quot;, label: &quot;路线&quot;, text: &quot;JR大津京站乘12:55新快速“敦贺行”，走JR湖西线，13:23到近江高岛；看清列车是否停靠近江高岛再上车。&quot; },
      { kind: &quot;action&quot;, label: &quot;怎么做&quot;, text: &quot;12:40前进入正确站台；普通车厢先到先坐。到站前背好器材，13:23下车后直接到事先确认的出租车接站点。&quot; },
      { kind: &quot;cost&quot;, label: &quot;费用&quot;, text: &quot;JR湖西线这段由Kansai Area Pass覆盖；普通新快速无需另付特急费或指定席费。&quot; },
      { kind: &quot;background&quot;, label: &quot;名词背景&quot;, text: &quot;湖西线沿琵琶湖西岸运行；“敦贺行”是去程方向，“新快速”不是新干线。&quot; },
      { kind: &quot;risk&quot;, label: &quot;注意&quot;, text: &quot;班次是硬卡点；坐反方向或误乘不停近江高岛的列车会破坏预约出租车时间。车窗只能观察天气，不替代正式拍摄。&quot; },
      { kind: &quot;backup&quot;, label: &quot;备用&quot;, text: &quot;错过12:55按延误表改乘13:55、14:23到；普通出租车改约14:30接站，并把白鬚神社拍摄压缩到约30分钟。&quot; }
    ],
    &quot;step-takashima&quot;: [
      { kind: &quot;route&quot;, label: &quot;接站流程&quot;, text: &quot;13:23到近江高岛站后不找寄存柜，直接到预约时约定的站前接客点；普通出租车建议13:25接，约10–15分钟到白鬚神社。&quot; },
      { kind: &quot;action&quot;, label: &quot;至少提前一天预约&quot;, items: [&quot;首选让琵琶湖酒店前台代打0120-524-447；也可本人拨第一交通滋贺。&quot;, &quot;报日期、13:25、近江高岛站、白鬚神社/藍湖白鬚台、人数和三脚架。&quot;, &quot;同时预约14:50回程，确认两次接客点、迎车费、预计车费和预约记录。&quot;], wide: true },
      { kind: &quot;cost&quot;, label: &quot;费用&quot;, text: &quot;近江高岛站↔白鬚神社普通出租车参考约¥1,800–2,400/车/单程，往返准备约¥3,600–4,800，另预留迎车/等待费；按计价器、交通和接送点变化。高岛市乘合出租成人¥300/次、儿童¥150/次，13:45去程须在13:15前预约，14:56回程须在14:13前预约。&quot; },
      { kind: &quot;background&quot;, label: &quot;普通车 / 乘合车&quot;, text: &quot;普通出租车可指定时间地点、车辆独享；乘合出租是固定班次和停靠点的共享车，成人¥300/次、儿童¥150/次。官方说明的预约截止会按班次计算：本计划13:45去程为13:15前、14:56回程为14:13前，最终以预约系统为准；晚到通常不会像包车一样等待。&quot; },
      { kind: &quot;language&quot;, label: &quot;电话预约原句&quot;, phrase: &quot;もしもし。9月4日13時25分に、近江高島駅から白鬚神社の湖側の安全な乗車場所まで、普通タクシーを1台予約したいです。大人1名、三脚1本です。帰りは14時50分に同じ乗車場所から近江高島駅までお願いします。待ち合わせ場所と料金の目安を教えてください。&quot;, romaji: &quot;Moshi moshi. Kugatsu yokka juusan-ji nijuu-go-fun ni, Omi-Takashima-eki kara Shirahige Jinja no mizube no anzen na jousha basho made, futsuu takushii o ichidai yoyaku shitai desu. Otona ichimei, sankyaku ippon desu. Kaeri wa juuyo-ji gojuppun ni onaji jousha basho kara Omi-Takashima-eki made onegaishimasu. Machiawase basho to ryoukin no meyasu o oshiete kudasai.&quot;, meaning: &quot;您好，想预约9月4日13:25从近江高岛站到白鬚神社湖侧安全接送点的普通出租车1台；1名成人、1支三脚架；14:50从同一接送点返回车站。请告知集合点和预计费用。&quot;, wide: true },
      { kind: &quot;language&quot;, label: &quot;乘合出租短句&quot;, phrase: &quot;9月4日13時45分の予約乗合タクシーを予約したいです。乗車は近江高島駅、降車は白鬚神社です。大人1名です。帰りは14時56分の便です。&quot;, romaji: &quot;Kugatsu yokka juusan-ji yonjuugo-fun no yoyaku noriai takushii o yoyaku shitai desu. Jousha wa Omi-Takashima-eki, kousha wa Shirahige Jinja desu. Otona ichimei desu. Kaeri wa juuyo-ji gojuuroppun no bin desu.&quot;, meaning: &quot;想预约9月4日13:45的预约乘合出租；上车近江高岛站、下车白鬚神社，1名成人；回程是14:56班次。&quot;, wide: true },
      { kind: &quot;risk&quot;, label: &quot;注意&quot;, text: &quot;近江高岛站没有寄存柜；不要带未寄存的大行李。预约后把公司、电话、接送时间和地点截屏保存，迟到要尽快电话说明。&quot; },
      { kind: &quot;backup&quot;, label: &quot;省钱备用&quot;, text: &quot;按现有时刻可查13:45去程、14:56回程乘合出租；去程最晚13:15、回程最晚14:13提交预约，并按固定站点上车。它会明显压缩神社拍摄时间，使用前核对当日PDF和预约系统。&quot; }
    ],
    &quot;step-shrine&quot;: [
      { kind: &quot;route&quot;, label: &quot;现场顺序&quot;, text: &quot;让车停在预约确认的安全接送点；先到神社一侧的藍湖白鬚台拍湖中鸟居，再回神社境内参拜和拍建筑，14:45前收机，14:50到原接客点。&quot; },
      { kind: &quot;action&quot;, label: &quot;怎么做&quot;, items: [&quot;到场先确认回程司机/集合点和手机信号。&quot;, &quot;先拍最重要的鸟居正面与湖面，再补神社环境照。&quot;, &quot;14:40开始拆脚架，14:45完成清点，给回程车留5分钟。&quot;] },
      { kind: &quot;cost&quot;, label: &quot;费用&quot;, text: &quot;神社境内和观景台通常无需门票，参拜奉纳自愿；普通出租车往返预算约¥3,600–4,800/车（单程约¥1,800–2,400），按计价器，迎车/等待费可能另计。任何临时收费或交通管制以现场公告为准。&quot; },
      { kind: &quot;background&quot;, label: &quot;背景&quot;, text: &quot;白鬚神社以琵琶湖中的大鸟居闻名，是本日风光摄影重点，但不是当前官方《再见菈菈》动画舞台。&quot; },
      { kind: &quot;photo&quot;, label: &quot;摄影&quot;, text: &quot;70–200mm优先，ISO 100、f/8、1/250–1/500s冻结清晰水纹与倒影；水面需要柔化时再用ND做1–8秒长曝。CPL只旋到反光和蓝色自然，不要压到最强。&quot; },
      { kind: &quot;risk&quot;, label: &quot;安全 / 管制&quot;, text: &quot;绝不横穿国道161，也不要站上车道拍摄。9月4日14:00起因翌日大祭关闭停车场，出租车接送点可能变化，必须在预约时确认。雷暴时不在湖岸架金属脚架。&quot; },
      { kind: &quot;backup&quot;, label: &quot;天气备用&quot;, text: &quot;阴天改拍极简鸟居、压缩远山和长焦细节；大风时缩短脚架中轴并提高快门。若回程车提前到，立即以15:21列车为优先停止拍摄。&quot; }
    ],
    &quot;step-return-taxi&quot;: [
      { kind: &quot;route&quot;, label: &quot;路线&quot;, text: &quot;14:50从事先确认的神社接客点上车，直接回近江高岛站；目标15:05前抵达，为15:21新快速留约16分钟进站缓冲。&quot; },
      { kind: &quot;action&quot;, label: &quot;怎么做&quot;, text: &quot;14:45前站到接客点，看到车辆先核对公司/姓名；上车再次说近江高岛站和15:21列车。到站后立即进JR闸机。&quot; },
      { kind: &quot;cost&quot;, label: &quot;费用&quot;, text: &quot;普通出租车参考约¥1,800–2,400/车/单程，按计价器；如果司机原地等候，等待费可能持续计入。预约时应明确是“回程另配车”还是“现场等候”。乘合出租为成人¥300/次、儿童¥150/次，但班次固定且须提前预约。&quot; },
      { kind: &quot;language&quot;, label: &quot;给司机看&quot;, phrase: &quot;近江高島駅までお願いします。15時21分の新快速に乗ります。&quot;, romaji: &quot;Omi-Takashima-eki made onegaishimasu. Juugo-ji nijuu-ippun no Shin-kaisoku ni norimasu.&quot;, meaning: &quot;请去近江高岛站；我要乘15:21的新快速。&quot;, wide: true },
      { kind: &quot;risk&quot;, label: &quot;注意&quot;, text: &quot;9月大祭管制可能让车无法停在原位置。手机保持可接听；超过14:52还未见车就立即拨预约电话。&quot; },
      { kind: &quot;backup&quot;, label: &quot;备用&quot;, text: &quot;乘合方案按14:56回程班次执行；若普通车迟到，优先让司机送到最近可安全下车的站口，不在车站外整理器材。&quot; }
    ],
    &quot;step-return-jr&quot;: [
      { kind: &quot;route&quot;, label: &quot;路线&quot;, text: &quot;近江高岛站乘15:21新快速“姬路行”，沿湖西线返回，15:48到JR大津京。&quot; },
      { kind: &quot;action&quot;, label: &quot;怎么做&quot;, text: &quot;15:05到站后直接看电子屏和站台，不安排站前拍摄；车上补水、检查电池，准备下车后步行换京阪。&quot; },
      { kind: &quot;cost&quot;, label: &quot;费用&quot;, text: &quot;Kansai Area Pass覆盖；普通新快速无需指定席或额外费用。&quot; },
      { kind: &quot;background&quot;, label: &quot;名词背景&quot;, text: &quot;“姬路行”表示向南/西返回的列车方向，不是需要去姬路换乘；在JR大津京下车即可。&quot; },
      { kind: &quot;risk&quot;, label: &quot;注意&quot;, text: &quot;返程班次同样是硬卡点；不要误上敦贺方向。到大津京后只有9分钟换到京阪，提前移动到车门附近。&quot; },

  function screenPointForNode(node, shellRect) {
    const projected = projection(node.coord);

  function candidatePinOffsets(preferred) {
    const offsets = [preferred];
    const baseAngle = Math.atan2(preferred.dy, preferred.dx);
    const angleSteps = [0, Math.PI / 4, -Math.PI / 4, Math.PI / 2, -Math.PI / 2, 3 * Math.PI / 4, -3 * Math.PI / 4, Math.PI];
    [42, 56, 72, 90, 110, 132, 154].forEach(function (radius) {
      angleSteps.forEach(function (angleStep) {
        const angle = baseAngle + angleStep;
        offsets.push({ dx: Math.cos(angle) * radius, dy: Math.sin(angle) * radius });
      });
    });
    return offsets;
  }

  function rectanglesOverlap(a, b, gap) {
    return !(a.right + gap &lt;= b.left || a.left &gt;= b.right + gap || a.bottom + gap &lt;= b.top || a.top &gt;= b.bottom + gap);
  }

  function positionMapMediaPins() {
    if (!projection || !svg.node().getScreenCTM()) return;
    const shellRect = shell.getBoundingClientRect();
    const svgRect = svg.node().getBoundingClientRect();
    const mapWidth = svgRect.width;
    const mapHeight = svgRect.height;
    const visibleNodes = nodes.filter(function (node) {
      return viewNodeIds[currentView].indexOf(node.id) &gt;= 0 &amp;&amp; nodeMediaIds[node.id];
    });
    const points = new Map(visibleNodes.map(function (node) {
      return [node.id, screenPointForNode(node, shellRect)];
    }));
    // Use the actual SVG hit-circle bounds instead of a small point radius. The
    // hit target is 36px wide, so point-only checks let a thumbnail cover the
    // neighbouring node on narrow maps.
    const nodeRects = Array.from(nodeLayer.selectAll(&quot;.node-group&quot;).nodes()).map(function (group) {
      const node = group.__data__;
      const hit = group.querySelector(&quot;.node-hit&quot;);
      if (!node || !hit || viewNodeIds[currentView].indexOf(node.id) &lt; 0) return null;
      const rect = hit.getBoundingClientRect();
      return {
        id: node.id,
        left: rect.left - shellRect.left,
        right: rect.right - shellRect.left,
        top: rect.top - shellRect.top,
        bottom: rect.bottom - shellRect.top
      };
    }).filter(function (rect) {
      return rect &amp;&amp; rect.right &gt; rect.left &amp;&amp; rect.bottom &gt; rect.top;
    });
    // Reserve both node labels and geographic context labels (lake/province).
    // The latter are easy to overlook because they are rendered in a separate
    // SVG join, but a thumbnail should not obscure them on compact views.
    const labelRects = Array.from(root.querySelectorAll(&quot;.node-label, .map-place-label&quot;)).map(function (label) {
      const rect = label.getBoundingClientRect();
      return {
        left: rect.left - shellRect.left, right: rect.right - shellRect.left,
        top: rect.top - shellRect.top, bottom: rect.bottom - shellRect.top
      };
    }).filter(function (rect) { return rect.right &gt; rect.left &amp;&amp; rect.bottom &gt; rect.top; });
    const placed = [];
    const placementOrder = visibleNodes.slice().sort(function (a, b) {
      const rank = function (node) {
        // Keep the currently selected point and confirmed anime stages visible first.
        if (selectedNodeIds.has(node.id)) return 0;
        if (laraByNodeId[node.id] &amp;&amp; laraByNodeId[node.id].kind === &quot;official&quot;) return 1;
        if (node.type === &quot;photo&quot;) return 2;
        if (laraByNodeId[node.id]) return 3;
        return 4;
      };
      return rank(a) - rank(b) || a.number - b.number;
    });

    placementOrder.forEach(function (node) {
      const pin = mediaLayer.querySelector(`[data-node-id=&quot;${node.id}&quot;]`);
      if (!pin) return;
      pin.hidden = false;
      pin.classList.remove(&quot;is-hidden&quot;);
      pin.setAttribute(&quot;aria-hidden&quot;, &quot;false&quot;);
      pin.tabIndex = 0;
      const pinRect = pin.getBoundingClientRect();
      const pinWidth = pinRect.width || 44;
      const pinHeight = pinRect.height || 34;
      const halfWidth = pinWidth / 2;
      const halfHeight = pinHeight / 2;
      const anchor = points.get(node.id);
      const preferred = (mapPinPreferred[currentView] &amp;&amp; mapPinPreferred[currentView][node.id]) || { dx: 34, dy: -34 };
      const candidates = candidatePinOffsets(preferred);

      function candidateRect(offset) {
        const centerX = Math.max(halfWidth + 7, Math.min(anchor.x + offset.dx, mapWidth - halfWidth - 7));
        const centerY = Math.max(halfHeight + 7, Math.min(anchor.y + offset.dy, mapHeight - halfHeight - 7));
        return {
          centerX: centerX, centerY: centerY,
          left: centerX - halfWidth, right: centerX + halfWidth,
          top: centerY - halfHeight, bottom: centerY + halfHeight
        };
      }

      function coversAnotherNode(rect) {
        return nodeRects.some(function (nodeRect) {
          return rectanglesOverlap(rect, nodeRect, 5);
        });
      }

      function coversLabel(rect) {
        return labelRects.some(function (labelRect) { return rectanglesOverlap(rect, labelRect, 4); });
      }

      // Every accepted candidate must clear all node hit areas, visible labels and
      // previously placed pins. Do not fall back to an overlapping position on

  function renderMapMediaPins() {

      .attr(&quot;class&quot;, &quot;node-label&quot;).text(function (node) { return node.short; });
